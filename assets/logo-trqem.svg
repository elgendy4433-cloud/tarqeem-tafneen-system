<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <rect width="240" height="70" rx="12" fill="#151e48"/>
  <!-- Two cyan stepped rectangles (Trqem Brand Identity) -->
  <rect x="20" y="24" width="22" height="11" rx="1" fill="#4dc3f7"/>
  <rect x="34" y="35" width="22" height="11" rx="1" fill="#4dc3f7"/>
  
  <!-- TRQEM English Subtitle -->
  <text x="215" y="24" text-anchor="end" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="11" letter-spacing="3">TRQEM</text>
  
  <!-- ترقيم Arabic Typography -->
  <text x="215" y="52" text-anchor="end" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="900" font-size="26" letter-spacing="0">تـرقـيـم</text>
  
  <!-- TM mark -->
